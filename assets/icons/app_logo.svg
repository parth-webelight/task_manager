<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>

    <!-- Card Inner Gradient -->
    <linearGradient id="cardGradient" x1="128" y1="96" x2="384" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F1F5F9" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Checkmark Accent Gradient -->
    <linearGradient id="checkGradient" x1="180" y1="260" x2="340" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGradient" x1="100" y1="100" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>

    <filter id="glow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Rounded Shield / Container with Shadow -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGradient)" filter="url(#shadow)"/>

  <!-- Decorative Outer Glow Ring -->
  <rect x="48" y="48" width="416" height="416" rx="88" fill="none" stroke="url(#accentGradient)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Task Clipboard Body / Inner Card -->
  <rect x="112" y="112" width="288" height="320" rx="36" fill="url(#cardGradient)"/>

  <!-- Clipboard Top Header Clip -->
  <rect x="186" y="86" width="140" height="52" rx="16" fill="#312E81"/>
  <rect x="216" y="98" width="80" height="12" rx="6" fill="#818CF8"/>

  <!-- Task List Lines & Badges -->
  <!-- Line 1: Check Box & Line -->
  <rect x="152" y="172" width="36" height="36" rx="10" fill="#E0E7FF"/>
  <path d="M162 190 L168 196 L178 184" stroke="#4F46E5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="204" y="182" width="160" height="16" rx="8" fill="#4F46E5" fill-opacity="0.9"/>

  <!-- Line 2: Check Box & Line -->
  <rect x="152" y="232" width="36" height="36" rx="10" fill="#E0E7FF"/>
  <path d="M162 250 L168 256 L178 244" stroke="#4F46E5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="204" y="242" width="120" height="16" rx="8" fill="#6366F1" fill-opacity="0.8"/>

  <!-- Line 3: Check Box & Line -->
  <rect x="152" y="292" width="36" height="36" rx="10" fill="#EEF2FF"/>
  <rect x="204" y="302" width="140" height="16" rx="8" fill="#94A3B8" fill-opacity="0.5"/>

  <!-- Prominent Dynamic Green Success Badge -->
  <circle cx="340" cy="340" r="54" fill="url(#checkGradient)" filter="url(#glow)"/>
  <path d="M318 340 L332 354 L362 324" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
